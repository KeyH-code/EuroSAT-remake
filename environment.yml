name: dl-reboot
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.0+cu130
      - torchvision==0.29.0+cu130
      - numpy>=2.0,<3
      - pandas>=2.2,<3
      - pillow>=10,<12
      - matplotlib>=3.9,<4
      - scikit-learn>=1.6,<2
      - pytest>=8,<10

